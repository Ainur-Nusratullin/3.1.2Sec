<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Details</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            min-height: 100vh;
            margin: 0;
            padding-top: 20px; /* Add padding at the top */
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .table-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px; /* Add some space below the table */
        }
        table {
            border-collapse: collapse;
            width: 100%; /* Table width within the container */
        }


        th, td {
            border: 1px solid #ddd;
            padding: 10px; /* Increase padding */
            text-align: left;
        }
        th {
            background-color: #f2f2f2; /* Light gray background for header cells */
            font-weight: bold; /* Make the header bold */
        }
        .button-container {
            display: flex;
            gap: 5px; /* Add some space between buttons */
        }

        .button-container input[type="button"] {
            background-color: #007bff;
            color: white;
            padding: 5px 10px; /* Smaller button sizes */
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px; /* Smaller font */
        }

        .button-container input[type="button"]:hover {
            background-color: #0056b3; /* Darken color on hover */
        }
        input[type="button"] {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px; /* Space above button */
        }
        input[type="button"]:hover {
            background-color: #0056b3; /* Darken color on hover */
        }

        .logout-container {
            display: flex;
            justify-content: flex-end; /* Align to the right */
            padding: 10px;
        }

        .logout-button {
            background-color: #ffa500; /* Orange color */
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-button:hover {
            background-color: #ff8c00; /* Darker orange on hover */
        }

    </style>
</head>
<body>

<div class="logout-container">
    <form th:action="@{/login}" method="post">  <!-- Changed to /logout -->
        <button type="submit" class="logout-button">Выйти</button>
    </form>
</div>

<div class="table-container">
    <h2>User Details</h2>
    <table class="table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Surname</th>
            <th>Age</th>
            <th>Email</th>
            <th>Role</th>
            <th>Operations</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="allUser : ${allUser}">
            <td th:text="${allUser.id}"></td>
            <td th:text="${allUser.name}"></td>
            <td th:text="${allUser.surname}"></td>
            <td th:text="${allUser.age}"></td>
            <td th:text="${allUser.email}"></td>
            <td th:text="${allUser.roles}"></td>
            <td>
                <div class="button-container">
                    <input type="button" value="Update" th:onclick="'window.location.href = \'' + @{/admin/editUser(id=${allUser.id})} + '\''"/>
                    <input type="button" value="Delete" th:onclick="'window.location.href = \'' + @{/admin/deleteUser(id=${allUser.id})} + '\''"/>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>


<input type="button" value="Add New User" onclick="window.location.href = '/admin/addNewUser'"/>

</body>
</html>
